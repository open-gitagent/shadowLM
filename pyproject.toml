[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowlm"
version = "0.2.0"
description = "ShadowLM Trainer — fine-tune any open model, from any harness, with any method."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Lyzr Research Labs"},
]
maintainers = [
    {name = "Khush Patel", email = "khush@lyzr.ai"},
]
keywords = [
    "fine-tuning", "llm", "lora", "qlora", "dpo", "grpo", "rlhf",
    "mlx", "pytorch", "peft", "agents", "training",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core SDK is pure-stdlib: `pip install shadowlm` gives you the full API. A
# training backend is opt-in: [mlx] on Apple Silicon, [torch] on CUDA/CPU.
dependencies = []

[project.urls]
Homepage = "https://github.com/open-gitagent/shadowLM"
Repository = "https://github.com/open-gitagent/shadowLM"
Issues = "https://github.com/open-gitagent/shadowLM/issues"

[project.scripts]
shadowlm = "shadowlm._cli_entry:main"

[project.optional-dependencies]
# Apple Silicon — the native path (Metal GPU).
mlx = [
    "mlx-lm>=0.20",
]
# Preference training (dpo/grpo) on Apple Silicon. CUDA boxes use [torch]/trl.
preference = [
    "mlx-lm-lora>=2.0",
]
# Mixture of Retrieval Experts (method="more") — fact index + retrieval.
retrieval = [
    "sentence-transformers>=3.0",
]
# The polished `shadowlm` command (Typer + Rich). The library itself stays
# pure-stdlib; only the CLI rendering needs these.
cli = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]
# CUDA / CPU — the PyTorch / HuggingFace path.
torch = [
    "datasets>=2.20",
    "transformers>=4.43",
    "trl>=0.9",
    "peft>=0.12",
    "accelerate>=0.33",
    "torch>=2.3",
]
# The full package for a CUDA/CPU box: training + retrieval + CLI.
all = [
    "shadowlm[torch,retrieval,cli]",
]
# The full local-dev-loop package: mlx training + preference + retrieval + CLI.
mlx-all = [
    "shadowlm[mlx,preference,retrieval,cli]",
]

[tool.setuptools.packages.find]
include = ["shadowlm*"]

[tool.setuptools.package-data]
shadowlm = ["_assets/*.png"]
